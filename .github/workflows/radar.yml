# Radar automático: a cada 2 horas procura notícias novas de GTA VI.
# - Com ANTHROPIC_API_KEY: escreve o post (BR + US), renderiza capa/carrossel/vídeo e manda no Telegram/Discord.
# - Sem a chave: manda um alerta "notícia nova" para você pedir o post ao Codex/Claude.
# Secrets (Settings > Secrets and variables > Actions):
#   ANTHROPIC_API_KEY (opcional), TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL (opcional)
name: radar

on:
  schedule:
    - cron: "17 */2 * * *"     # a cada 2h (mude para "*/30 * * * *" se quiser mais rápido)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
      HYPERFRAMES_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências leves
        run: pip install pyyaml requests feedparser pillow numpy
      - name: Tem notícia nova?
        id: check
        run: python -m leonida auto --check --min-score 110
      - name: Dependências completas
        if: steps.check.outputs.new != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - uses: actions/setup-node@v4
        if: steps.check.outputs.new != '0'
        with:
          node-version: "22"
      - name: Redigir, renderizar e enviar
        if: steps.check.outputs.new != '0'
        run: python -m leonida auto --min-score 110 --max 3
      - name: Salvar no repositório
        run: |
          git config user.name "leonida-bot"
          git config user.email "leonida-bot@users.noreply.github.com"
          git add -A prontos posts state
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
