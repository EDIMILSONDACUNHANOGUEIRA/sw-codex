# Pesquisa de feeds públicos, independente da conta de ChatGPT.
# Produção, revisão e entrega dos vídeos ficam na rotina local do Codex.
name: radar

on:
  schedule:
    - cron: "0 15,21 * * *"    # 11h e 17h America/Cuiaba (UTC-4)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências leves
        run: pip install pyyaml requests feedparser pillow numpy
      - name: Atualizar radar de notícias
        run: python -m leonida radar --hours 72
      - name: Salvar no repositório
        run: |
          git config user.name "leonida-bot"
          git config user.email "leonida-bot@users.noreply.github.com"
          git add state/radar.json prontos/RADAR.md
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
