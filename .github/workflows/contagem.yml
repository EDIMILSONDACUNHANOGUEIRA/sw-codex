# Post diário "faltam X dias para GTA VI" (08:00 no horário de Brasília). Não precisa de IA.
name: contagem

on:
  schedule:
    - cron: "52 10 * * *"      # 10:52 UTC = 07:52 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contagem:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
      HYPERFRAMES_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: TZ=America/Sao_Paulo python -m leonida contagem --enviar
      - name: Salvar no repositório
        run: |
          git config user.name "leonida-bot"
          git config user.email "leonida-bot@users.noreply.github.com"
          git add -A prontos posts
          git diff --cached --quiet || git commit -m "contagem: $(date -u +'%Y-%m-%d')"
          git push
