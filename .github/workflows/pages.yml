# Publica a galeria prontos/ no GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: galeria

on:
  push:
    branches: [main]
    paths: ["prontos/**"]
  workflow_run:
    workflows: [radar, contagem]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prontos
      - id: deployment
        uses: actions/deploy-pages@v4
