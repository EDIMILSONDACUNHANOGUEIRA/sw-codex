  headline: 'GTA VI terá *furacões*'
  summary: Tempestades locais, poças persistentes e arco-íris fazem parte do clima de Leonida.
  caption: |
    O clima de Leonida vai muito além de sol e praia.

    Na reportagem de 29 de setembro da Game Informer, a Rockstar confirmou tempestades tropicais e furacões em GTA VI.

    A chuva pode acontecer em uma região enquanto outra continua ensolarada. Depois da tempestade, poças e superfícies molhadas permanecem. Sob a iluminação certa, também pode surgir um arco-íris.

    A frequência dos furacões e seus efeitos nas missões ainda não foram detalhados. Imagens oficiais da Rockstar ilustram a notícia.

    Você vai encarar a tempestade ou procurar abrigo? Siga @leonidawirebrz.
