  headline: "Novo vazamento mostra *25 minutos* de GTA VI e possível *primeira pessoa*"
  summary: "Cenas de uma versão em desenvolvimento. A Rockstar não confirmou nada."
  caption: |
    🚨 VAZOU DE NOVO: o leaker Cyberleek voltou com cerca de 25 minutos de gameplay de uma versão em desenvolvimento de GTA VI.

    O que mais chamou atenção: o Jason aparece dirigindo vários carros em PRIMEIRA PESSOA — e continua assim depois de sair do carro. Também tem trecho de corrida de moto off-road e a Lucia aparece no fim.

    ⚠️ É build de desenvolvimento: nada disso é confirmado pela Rockstar para o lançamento.

    Você quer modo primeira pessoa em GTA VI? 👇
