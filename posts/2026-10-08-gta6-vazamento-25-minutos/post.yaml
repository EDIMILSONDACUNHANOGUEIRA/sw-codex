en:
  kicker: LEAKED
  headline: "New leak shows *25 minutes* of GTA VI — and a possible *first-person mode*"
  summary: "Footage comes from a development build. Rockstar hasn't confirmed anything."
  caption: |
    🚨 LEAKED AGAIN: leaker Cyberleek is back with roughly 25 minutes of gameplay from a GTA VI development build.

    The big one: Jason drives multiple cars in FIRST-PERSON — and stays in first-person after getting out. There's also an off-road dirt bike sequence, and Lucia shows up later on.

    ⚠️ It's a dev build, so none of this is confirmed for launch.

