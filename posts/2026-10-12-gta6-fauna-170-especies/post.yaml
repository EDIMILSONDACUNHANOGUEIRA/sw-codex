  headline: 'GTA VI: *170+ espécies*'
  summary: A Rockstar detalhou a fauna de Leonida à Game Informer em 29 de setembro.
  caption: |
    Mais de 170 espécies de animais em GTA VI.

    A Game Informer publicou os detalhes da Rockstar em 29 de setembro: Leonida terá fauna terrestre, aérea e marinha inspirada na Flórida.

    Flamingos, peixes-boi e jacarés estarão junto de espécies invasoras, como iguanas-verdes, sapos-cururus e macacos rhesus.

    Certos animais poderão ser rastreados em categorias que incluem raros e lendários. A identidade dessas criaturas especiais segue em segredo.

    Imagens oficiais da Rockstar ilustram esta notícia.

    Qual animal você quer encontrar primeiro? Siga @leonidawirebrz.
