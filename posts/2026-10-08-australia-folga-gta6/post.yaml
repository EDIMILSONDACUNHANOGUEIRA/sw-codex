en:
  kicker: DAY OFF
  headline: "Australia's government explains how to get *time off for GTA VI*"
  summary: "The country's workplace regulator listed your leave options. The best one? Just ask."
  caption: |
    😂 This is real: Australia's Fair Work Ombudsman posted a guide on getting time off for the GTA VI launch.

    The unpaid leave options it listed:
    1. Someone you care for needs you
    2. Voluntary emergency management
    3. Parental leave (the baby would need to arrive in ~5 weeks 💀)
    4. Just ask your boss

    Spoiler: #4 is the only realistic one. Are you calling in on Nov 19? 👇
  hashtags: ["#gta6meme", "#dayoff", "#australia"]
