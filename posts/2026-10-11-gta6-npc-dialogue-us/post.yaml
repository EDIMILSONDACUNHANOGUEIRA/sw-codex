  selo: "ROCKSTAR INTERVIEW"
  headline: "GTA VI: *street stories*"
  summary: "Rockstar has a dedicated writing team for the conversations you hear around the city."
  caption: |
    GTA VI's street conversations have their own writing team.

    In LOVE's October 5 interview, Rupert Humphries describes dedicated pedestrian dialogue writers in Los Angeles, plus advertising and comedy writers across New York, LA and London.

    GamesRadar+'s October 11 coverage also highlights James Horton's goal: conversations should work whether you pass by quickly or stop to listen closely.

    These comments describe Rockstar's writing approach. They do not promise unlimited AI dialogue or a quest from every pedestrian.

    Official Rockstar images illustrate this report. Will you stop and listen? Follow @leonidawireusa.
