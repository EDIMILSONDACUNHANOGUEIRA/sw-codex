  headline: For the first time in GTA, you can listen to *radio and podcasts on foot*
  summary: Jason and Lucia plug headphones into their phones to play stations and podcasts anywhere.
  caption: |
    🎧 This changes everything: in GTA VI the music doesn't stay in the car.

    Rockstar confirmed Jason and Lucia can listen to the radio AND brand-new on-demand podcasts while walking around, using headphones and earbuds connected to their phones. It's the first time the series has in-game podcasts.

    What's on your playlist while you explore Vice City? 👇
