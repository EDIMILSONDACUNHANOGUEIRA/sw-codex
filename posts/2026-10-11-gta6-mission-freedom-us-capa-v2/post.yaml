  selo: ROCKSTAR INTERVIEW
  headline: 'GTA VI: *more freedom*'
  summary: Rockstar describes alternative routes in missions, with story moments still guiding the action.
  caption: 'GTA VI missions are opening up.


    In an IGN interview covered by GamesRadar+ on October 8, Rob Nelson describes a tower-block escape with multiple exits and a police chase where you can take a different route from the one suggested.


    Rockstar wants mission systems to feel consistent with the open world. Story moments still sometimes need a guided sequence, so the goal is more choice where it fits the narrative.


    Official Rockstar images illustrate this report.


    Will you follow the route or improvise? Follow @leonidawireusa.

