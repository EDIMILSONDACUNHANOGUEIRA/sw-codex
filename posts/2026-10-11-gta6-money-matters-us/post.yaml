  selo: "ROCKSTAR INTERVIEW"
  headline: "GTA VI: *money matters*"
  summary: "Rockstar says earning in-game cash will be required at some points in the story."
  caption: |
    Your in-game wallet will matter in GTA VI.

    Rob Nelson told IGN that money plays a bigger role in this story. GamesRadar+'s October 7 report highlights his examples: selling stolen cars and carrying out robberies to earn cash at certain points before progressing.

    This describes money earned through gameplay. The comments do not say every mission has a cash requirement or announce real-money payments to continue the story.

    Official Rockstar images illustrate this report.

    Would you enjoy earning your way through the story? Follow @leonidawireusa for GTA VI updates.
