# Fontes monitoradas pelo radar.
# weight = confiança/peso da fonte (1.0 = normal). official = notícia vinda da própria Rockstar/Take-Two.
# lang = idioma da fonte (pt ou en). Fontes PT ajudam a montar o post BR, EN o post US.

keywords:
  # Pelo menos um destes termos precisa aparecer no título/resumo para entrar no radar.
  must_match:
    - "gta 6"
    - "gta vi"
    - "gta6"
    - "grand theft auto 6"
    - "grand theft auto vi"
    - "leonida"
    - "jason duval"
    - "lucia caminos"
  # Termos que aumentam a prioridade (viralizam mais no TikTok).
  boost:
    trailer: 30
    "trailer 3": 40
    gameplay: 20
    screenshot: 15
    screenshots: 15
    "release date": 30
    "data de lançamento": 30
    delay: 40
    adiad: 40
    "pre-order": 20
    "pré-venda": 20
    price: 20
    preço: 20
    leak: 18
    vaza: 18
    radio: 15
    rádio: 15
    online: 10
    pc: 12
    map: 15
    mapa: 15
    rockstar: 8
    official: 15
    oficial: 15
  # Termos que derrubam a prioridade (listicles, guias genéricos, ofertas).
  penalty:
    deal: -25
    "best games": -20
    "games like": -25
    quiz: -30
    review: -10

sources:
  # ---- Oficiais ----
  - name: Rockstar Newswire (via Google News)
    url: "https://news.google.com/rss/search?q=site:rockstargames.com+%22Grand+Theft+Auto+VI%22&hl=en-US&gl=US&ceid=US:en"
    lang: en
    weight: 1.6
    official: true

  # ---- Portais BR ----
